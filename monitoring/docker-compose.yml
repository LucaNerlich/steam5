  grafana_dashboard_domain:
    content: |
      {
        "uid": "steam5-domain",
        "title": "Steam5 — Domain",
        "tags": ["steam5", "domain", "game"],
        "schemaVersion": 39,
        "editable": true,
        "graphTooltip": 1,
        "refresh": "30s",
        "time": {"from": "now-24h", "to": "now"},
        "timezone": "browser",
        "templating": {
          "list": [
            {
              "name": "app",
              "label": "Application",
              "type": "query",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "query": {"query": "label_values(jvm_memory_used_bytes, application)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
              "definition": "label_values(jvm_memory_used_bytes, application)",
              "refresh": 2,
              "includeAll": false,
              "multi": false,
              "current": {"text": "steam5", "value": "steam5"},
              "sort": 1
            }
          ]
        },
        "panels": [
          {
            "id": 1, "type": "stat", "title": "Today's picks generated",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 1}, {"color": "green", "value": 5}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "background", "graphMode": "none"},
            "targets": [{"refId": "A", "expr": "steam5_daily_picks_last_success_size{application=\"$$app\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 2, "type": "stat", "title": "Time since last successful generation",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 86400}, {"color": "red", "value": 93600}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "time() - steam5_daily_picks_last_success_epoch_seconds{application=\"$$app\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 3, "type": "stat", "title": "Reviews coverage",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "decimals": 2, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.5}, {"color": "green", "value": 0.8}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "steam5_app_reviews_coverage_ratio{application=\"$$app\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 4, "type": "stat", "title": "Details coverage",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "decimals": 2, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.5}, {"color": "green", "value": 0.8}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "steam5_app_details_coverage_ratio{application=\"$$app\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 5, "type": "timeseries", "title": "Steam API request rate by outcome",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 30, "stacking": {"mode": "normal", "group": "A"}}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}},
            "targets": [{"refId": "A", "expr": "sum by (outcome) (rate(steam_api_requests_total{application=\"$$app\"}[5m]))", "legendFormat": "{{outcome}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 6, "type": "timeseries", "title": "Steam API request rate by endpoint",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (endpoint) (rate(steam_api_requests_total{application=\"$$app\"}[5m]))", "legendFormat": "{{endpoint}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 7, "type": "timeseries", "title": "Steam API 429 rate-limit hits",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 20}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.01}]}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (endpoint) (rate(steam_api_rate_limit_hits_total{application=\"$$app\"}[5m]))", "legendFormat": "{{endpoint}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 8, "type": "timeseries", "title": "Steam API latency (avg 5m, by endpoint)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (endpoint) (rate(steam_api_request_duration_seconds_sum{application=\"$$app\"}[5m])) / clamp_min(sum by (endpoint) (rate(steam_api_request_duration_seconds_count{application=\"$$app\"}[5m])), 1e-9)", "legendFormat": "{{endpoint}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 9, "type": "timeseries", "title": "Steam API rate-limiter wait time (avg 5m)",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "rate(steam_api_rate_limiter_wait_seconds_sum{application=\"$$app\"}[5m]) / clamp_min(rate(steam_api_rate_limiter_wait_seconds_count{application=\"$$app\"}[5m]), 1e-9)", "legendFormat": "avg wait", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 10, "type": "timeseries", "title": "Ingestion freshness — oldest / newest review age",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "steam5_reviews_oldest_age_seconds{application=\"$$app\"}", "legendFormat": "oldest", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "steam5_reviews_newest_age_seconds{application=\"$$app\"}", "legendFormat": "newest", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 11, "type": "timeseries", "title": "Index size",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "steam5_app_index_size{application=\"$$app\"}", "legendFormat": "apps indexed", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 12, "type": "timeseries", "title": "Guesses persisted (5m rate, by outcome)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "ops", "custom": {"drawStyle": "bars", "fillOpacity": 80, "stacking": {"mode": "normal", "group": "A"}}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max", "sum"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (outcome) (rate(steam5_guesses_total{application=\"$$app\"}[5m]))", "legendFormat": "{{outcome}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 13, "type": "stat", "title": "Correct-guess ratio (24h)",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 36},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "decimals": 2}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(increase(steam5_guesses_total{application=\"$$app\", outcome=\"correct\"}[24h])) / clamp_min(sum(increase(steam5_guesses_total{application=\"$$app\"}[24h])), 1)", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 14, "type": "stat", "title": "Total guesses (24h)",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 36},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(increase(steam5_guesses_total{application=\"$$app\"}[24h]))", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 15, "type": "stat", "title": "Picks days recorded",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 36},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "steam5_picks_distinct_days{application=\"$$app\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 16, "type": "stat", "title": "Latest picks date",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 36},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "dateTimeAsIso"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none", "text": {}},
            "targets": [{"refId": "A", "expr": "steam5_picks_latest_date_epoch_seconds{application=\"$$app\"} * 1000", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          }
        ]
      }


  grafana_dashboard_hikari:
    content: |
      {
        "uid": "steam5-hikari",
        "title": "Steam5 — HikariCP",
        "tags": ["steam5", "hikari", "db"],
        "schemaVersion": 39,
        "editable": true,
        "graphTooltip": 1,
        "refresh": "30s",
        "time": {"from": "now-1h", "to": "now"},
        "timezone": "browser",
        "templating": {
          "list": [
            {
              "name": "app",
              "label": "Application",
              "type": "query",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "query": {"query": "label_values(jvm_memory_used_bytes, application)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
              "definition": "label_values(jvm_memory_used_bytes, application)",
              "refresh": 2,
              "includeAll": false,
              "multi": false,
              "current": {"text": "steam5", "value": "steam5"},
              "sort": 1
            },
            {
              "name": "pool",
              "label": "Pool",
              "type": "query",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "query": {"query": "label_values(hikaricp_connections{application=\"$$app\"}, pool)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
              "definition": "label_values(hikaricp_connections{application=\"$$app\"}, pool)",
              "refresh": 2,
              "includeAll": true,
              "allValue": ".*",
              "multi": false,
              "current": {"text": "All", "value": "$$__all"},
              "sort": 1
            }
          ]
        },
        "panels": [
          {
            "id": 1, "type": "stat", "title": "Active connections",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(hikaricp_connections_active{application=\"$$app\", pool=~\"$$pool\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 2, "type": "stat", "title": "Idle connections",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(hikaricp_connections_idle{application=\"$$app\", pool=~\"$$pool\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 3, "type": "stat", "title": "Pending acquisitions",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(hikaricp_connections_pending{application=\"$$app\", pool=~\"$$pool\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 4, "type": "stat", "title": "Connection timeouts (total)",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(hikaricp_connections_timeout_total{application=\"$$app\", pool=~\"$$pool\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 5, "type": "timeseries", "title": "Connection pool state",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "hikaricp_connections_active{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} active", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "hikaricp_connections_idle{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} idle", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "C", "expr": "hikaricp_connections{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} total", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "D", "expr": "hikaricp_connections_pending{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} pending", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 6, "type": "timeseries", "title": "Pool capacity (min / max)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineStyle": {"fill": "dash"}}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "hikaricp_connections_min{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} min", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "hikaricp_connections_max{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} max", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 7, "type": "timeseries", "title": "Avg connection acquire time (5m)",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "rate(hikaricp_connections_acquire_seconds_sum{application=\"$$app\", pool=~\"$$pool\"}[5m]) / clamp_min(rate(hikaricp_connections_acquire_seconds_count{application=\"$$app\", pool=~\"$$pool\"}[5m]), 1e-9)", "legendFormat": "{{pool}} avg acquire", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 8, "type": "timeseries", "title": "Avg connection usage time (5m)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "rate(hikaricp_connections_usage_seconds_sum{application=\"$$app\", pool=~\"$$pool\"}[5m]) / clamp_min(rate(hikaricp_connections_usage_seconds_count{application=\"$$app\", pool=~\"$$pool\"}[5m]), 1e-9)", "legendFormat": "{{pool}} avg usage", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 9, "type": "timeseries", "title": "Connection acquire/usage rate (per second)",
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "ops", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "rate(hikaricp_connections_acquire_seconds_count{application=\"$$app\", pool=~\"$$pool\"}[5m])", "legendFormat": "{{pool}} acquire/s", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "rate(hikaricp_connections_usage_seconds_count{application=\"$$app\", pool=~\"$$pool\"}[5m])", "legendFormat": "{{pool}} usage/s", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "C", "expr": "rate(hikaricp_connections_creation_seconds_count{application=\"$$app\", pool=~\"$$pool\"}[5m])", "legendFormat": "{{pool}} creation/s", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 10, "type": "timeseries", "title": "Avg connection creation time (5m)",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "rate(hikaricp_connections_creation_seconds_sum{application=\"$$app\", pool=~\"$$pool\"}[5m]) / clamp_min(rate(hikaricp_connections_creation_seconds_count{application=\"$$app\", pool=~\"$$pool\"}[5m]), 1e-9)", "legendFormat": "{{pool}} avg creation", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 11, "type": "timeseries", "title": "Max single-acquire / usage / creation time",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "hikaricp_connections_acquire_seconds_max{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} acquire max", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "hikaricp_connections_usage_seconds_max{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} usage max", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "C", "expr": "hikaricp_connections_creation_seconds_max{application=\"$$app\", pool=~\"$$pool\"}", "legendFormat": "{{pool}} creation max", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          }
        ]
      }


  grafana_dashboard_http_server:
    content: |
      {
        "uid": "steam5-http",
        "title": "Steam5 — HTTP server",
        "tags": ["steam5", "http"],
        "schemaVersion": 39,
        "editable": true,
        "graphTooltip": 1,
        "refresh": "30s",
        "time": {"from": "now-1h", "to": "now"},
        "timezone": "browser",
        "templating": {
          "list": [
            {
              "name": "app",
              "label": "Application",
              "type": "query",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "query": {"query": "label_values(jvm_memory_used_bytes, application)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
              "definition": "label_values(jvm_memory_used_bytes, application)",
              "refresh": 2,
              "includeAll": false,
              "multi": false,
              "current": {"text": "steam5", "value": "steam5"},
              "sort": 1
            }
          ]
        },
        "panels": [
          {
            "id": 1, "type": "stat", "title": "Total request rate",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{application=\"$$app\"}[5m]))", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 2, "type": "stat", "title": "Error rate (4xx + 5xx)",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.1}, {"color": "red", "value": 1}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{application=\"$$app\", outcome=~\"CLIENT_ERROR|SERVER_ERROR\"}[5m]))", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 3, "type": "stat", "title": "p95 latency (5m)",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"$$app\"}[5m])))", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 4, "type": "stat", "title": "Active requests",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(http_server_requests_active_seconds_gcount{application=\"$$app\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 5, "type": "timeseries", "title": "Request rate by URI",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10, "stacking": {"mode": "normal", "group": "A"}}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (uri, method) (rate(http_server_requests_seconds_count{application=\"$$app\"}[5m]))", "legendFormat": "{{method}} {{uri}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 6, "type": "timeseries", "title": "Request rate by status",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10, "stacking": {"mode": "normal", "group": "A"}}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (status, outcome) (rate(http_server_requests_seconds_count{application=\"$$app\"}[5m]))", "legendFormat": "{{status}} ({{outcome}})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 7, "type": "timeseries", "title": "Latency p50 / p95 / p99",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"$$app\"}[5m])))", "legendFormat": "p50", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"$$app\"}[5m])))", "legendFormat": "p95", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"$$app\"}[5m])))", "legendFormat": "p99", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 8, "type": "timeseries", "title": "Avg latency by URI (5m)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (uri) (rate(http_server_requests_seconds_sum{application=\"$$app\"}[5m])) / sum by (uri) (rate(http_server_requests_seconds_count{application=\"$$app\"}[5m]))", "legendFormat": "{{uri}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 9, "type": "table", "title": "Top URIs by total request count",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"showHeader": true},
            "targets": [{"refId": "A", "expr": "topk(10, sum by (method, uri, status) (http_server_requests_seconds_count{application=\"$$app\"}))", "format": "table", "instant": true, "datasource": {"type": "prometheus", "uid": "prometheus"}}],
            "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "application": true, "instance": true, "job": true, "exception": true, "error": true, "outcome": true}}}]
          },
          {
            "id": 10, "type": "timeseries", "title": "Max single-request duration (per URI)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "max by (uri) (http_server_requests_seconds_max{application=\"$$app\"})", "legendFormat": "{{uri}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 11, "type": "stat", "title": "Backend scrape target — up",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "background", "graphMode": "none"},
            "targets": [{"refId": "A", "expr": "up{job=\"steam5\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 12, "type": "stat", "title": "5xx rate (5m)",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.01}, {"color": "red", "value": 0.1}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{application=\"$$app\", status=~\"5..\"}[5m]))", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 13, "type": "stat", "title": "5xx ratio (5m)",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 3, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.01}, {"color": "red", "value": 0.05}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{application=\"$$app\", status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application=\"$$app\"}[5m])), 1e-9)", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 14, "type": "table", "title": "5xx requests by URI (cumulative)",
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 32},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"showHeader": true},
            "targets": [{"refId": "A", "expr": "topk(15, sum by (method, uri, status) (http_server_requests_seconds_count{application=\"$$app\", status=~\"5..\"}))", "format": "table", "instant": true, "datasource": {"type": "prometheus", "uid": "prometheus"}}],
            "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "application": true, "instance": true, "job": true, "exception": true, "error": true, "outcome": true}}}]
          }
        ]
      }


  grafana_dashboard_infra_containers:
    content: |
      {
        "uid": "steam5-infra-containers",
        "title": "Steam5 — Infra (containers)",
        "tags": ["steam5", "infra", "containers", "cadvisor"],
        "schemaVersion": 39,
        "editable": true,
        "graphTooltip": 1,
        "refresh": "30s",
        "time": {"from": "now-1h", "to": "now"},
        "timezone": "browser",
        "templating": {
          "list": [
            {
              "name": "container",
              "label": "Container",
              "type": "query",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "query": {"query": "label_values(container_last_seen{name=~\".+\"}, name)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
              "definition": "label_values(container_last_seen{name=~\".+\"}, name)",
              "refresh": 2,
              "includeAll": true,
              "allValue": ".+",
              "multi": true,
              "current": {"text": "All", "value": "$$__all"},
              "sort": 1
            }
          ]
        },
        "panels": [
          {
            "id": 1, "type": "stat", "title": "Running containers",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "count(container_last_seen{name=~\".+\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 2, "type": "stat", "title": "Total container memory used",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(container_memory_working_set_bytes{name=~\".+\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 3, "type": "stat", "title": "Container restarts (1h)",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(increase(container_start_time_seconds{name=~\".+\"}[1h] offset 0s) > bool 0)", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 4, "type": "stat", "title": "OOM events (1h)",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "sum(increase(container_oom_events_total{name=~\".+\"}[1h]))", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 5, "type": "timeseries", "title": "CPU usage by container",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}},
            "targets": [{"refId": "A", "expr": "sum by (name) (rate(container_cpu_usage_seconds_total{name=~\"$$container\"}[5m]))", "legendFormat": "{{name}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 6, "type": "timeseries", "title": "Memory working set by container",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}},
            "targets": [{"refId": "A", "expr": "container_memory_working_set_bytes{name=~\"$$container\"}", "legendFormat": "{{name}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 7, "type": "timeseries", "title": "Network RX/TX by container",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "binBps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "sum by (name) (rate(container_network_receive_bytes_total{name=~\"$$container\"}[5m]))", "legendFormat": "{{name}} rx", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "-sum by (name) (rate(container_network_transmit_bytes_total{name=~\"$$container\"}[5m]))", "legendFormat": "{{name}} tx", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 8, "type": "timeseries", "title": "Filesystem I/O by container",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "binBps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "sum by (name) (rate(container_fs_reads_bytes_total{name=~\"$$container\"}[5m]))", "legendFormat": "{{name}} read", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "-sum by (name) (rate(container_fs_writes_bytes_total{name=~\"$$container\"}[5m]))", "legendFormat": "{{name}} write", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 9, "type": "table", "title": "Top containers — current state",
            "gridPos": {"h": 10, "w": 24, "x": 0, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": [
              {"matcher": {"id": "byName", "options": "Value #mem"}, "properties": [{"id": "unit", "value": "bytes"}, {"id": "displayName", "value": "memory"}]},
              {"matcher": {"id": "byName", "options": "Value #cpu"}, "properties": [{"id": "unit", "value": "percentunit"}, {"id": "displayName", "value": "cpu"}]},
              {"matcher": {"id": "byName", "options": "Value #restart"}, "properties": [{"id": "displayName", "value": "uptime (s)"}, {"id": "unit", "value": "s"}]}
            ]},
            "options": {"showHeader": true},
            "targets": [
              {"refId": "cpu", "expr": "sum by (name) (rate(container_cpu_usage_seconds_total{name=~\"$$container\"}[5m]))", "format": "table", "instant": true, "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "mem", "expr": "container_memory_working_set_bytes{name=~\"$$container\"}", "format": "table", "instant": true, "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "restart", "expr": "time() - container_start_time_seconds{name=~\"$$container\"}", "format": "table", "instant": true, "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ],
            "transformations": [
              {"id": "joinByField", "options": {"byField": "name", "mode": "outer"}},
              {"id": "organize", "options": {"excludeByName": {"Time 1": true, "Time 2": true, "Time 3": true, "__name__": true, "instance": true, "job": true, "id": true, "image": true, "container_label_com_docker_compose_project": true, "container_label_com_docker_compose_service": true}}}
            ]
          }
        ]
      }


  grafana_dashboard_infra_host:
    content: |
      {
        "uid": "steam5-infra-host",
        "title": "Steam5 — Infra (host)",
        "tags": ["steam5", "infra", "host", "node-exporter"],
        "schemaVersion": 39,
        "editable": true,
        "graphTooltip": 1,
        "refresh": "30s",
        "time": {"from": "now-1h", "to": "now"},
        "timezone": "browser",
        "templating": {
          "list": [
            {
              "name": "instance",
              "label": "Instance",
              "type": "query",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "query": {"query": "label_values(node_uname_info, instance)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
              "definition": "label_values(node_uname_info, instance)",
              "refresh": 2,
              "includeAll": true,
              "allValue": ".*",
              "multi": false,
              "current": {"text": "All", "value": "$$__all"},
              "sort": 1
            }
          ]
        },
        "panels": [
          {
            "id": 1, "type": "stat", "title": "CPU busy",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "decimals": 2, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.7}, {"color": "red", "value": 0.9}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\", instance=~\"$$instance\"}[5m]))", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 2, "type": "stat", "title": "Memory used",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "decimals": 2, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.8}, {"color": "red", "value": 0.95}]}}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "1 - (node_memory_MemAvailable_bytes{instance=~\"$$instance\"} / node_memory_MemTotal_bytes{instance=~\"$$instance\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 3, "type": "stat", "title": "Load (1m)",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "avg(node_load1{instance=~\"$$instance\"})", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 4, "type": "stat", "title": "Uptime",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "time() - node_boot_time_seconds{instance=~\"$$instance\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 5, "type": "timeseries", "title": "CPU usage by mode",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "custom": {"drawStyle": "line", "fillOpacity": 30, "stacking": {"mode": "normal", "group": "A"}}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "sum by (mode) (rate(node_cpu_seconds_total{instance=~\"$$instance\", mode!=\"idle\"}[5m])) / scalar(count(count by (cpu) (node_cpu_seconds_total{instance=~\"$$instance\"})))", "legendFormat": "{{mode}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 6, "type": "timeseries", "title": "Memory breakdown",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 20, "stacking": {"mode": "normal", "group": "A"}}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "node_memory_MemTotal_bytes{instance=~\"$$instance\"} - node_memory_MemAvailable_bytes{instance=~\"$$instance\"} - node_memory_Buffers_bytes{instance=~\"$$instance\"} - node_memory_Cached_bytes{instance=~\"$$instance\"}", "legendFormat": "used", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "node_memory_Buffers_bytes{instance=~\"$$instance\"}", "legendFormat": "buffers", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "C", "expr": "node_memory_Cached_bytes{instance=~\"$$instance\"}", "legendFormat": "cache", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "D", "expr": "node_memory_MemAvailable_bytes{instance=~\"$$instance\"}", "legendFormat": "available", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 7, "type": "timeseries", "title": "Load average (1m / 5m / 15m)",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "node_load1{instance=~\"$$instance\"}", "legendFormat": "1m", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "node_load5{instance=~\"$$instance\"}", "legendFormat": "5m", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "C", "expr": "node_load15{instance=~\"$$instance\"}", "legendFormat": "15m", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 8, "type": "timeseries", "title": "Network I/O (per interface)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "binBps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "sum by (device) (rate(node_network_receive_bytes_total{instance=~\"$$instance\", device!~\"lo|docker.*|veth.*|br-.*\"}[5m]))", "legendFormat": "{{device}} rx", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "-sum by (device) (rate(node_network_transmit_bytes_total{instance=~\"$$instance\", device!~\"lo|docker.*|veth.*|br-.*\"}[5m]))", "legendFormat": "{{device}} tx", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 9, "type": "timeseries", "title": "Disk space used per mount",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "custom": {"drawStyle": "line", "fillOpacity": 20}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.8}, {"color": "red", "value": 0.9}]}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}},
            "targets": [{"refId": "A", "expr": "1 - (node_filesystem_avail_bytes{instance=~\"$$instance\", fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{instance=~\"$$instance\", fstype!~\"tmpfs|overlay|squashfs\"})", "legendFormat": "{{mountpoint}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 10, "type": "timeseries", "title": "Disk I/O (read / write)",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "binBps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
            "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}},
            "targets": [
              {"refId": "A", "expr": "sum by (device) (rate(node_disk_read_bytes_total{instance=~\"$$instance\"}[5m]))", "legendFormat": "{{device}} read", "datasource": {"type": "prometheus", "uid": "prometheus"}},
              {"refId": "B", "expr": "-sum by (device) (rate(node_disk_written_bytes_total{instance=~\"$$instance\"}[5m]))", "legendFormat": "{{device}} write", "datasource": {"type": "prometheus", "uid": "prometheus"}}
            ]
          },
          {
            "id": 11, "type": "stat", "title": "Open file descriptors (host)",
            "gridPos": {"h": 4, "w": 8, "x": 0, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "node_filefd_allocated{instance=~\"$$instance\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 12, "type": "stat", "title": "Max file descriptors",
            "gridPos": {"h": 4, "w": 8, "x": 8, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "node_filefd_maximum{instance=~\"$$instance\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          },
          {
            "id": 13, "type": "stat", "title": "TCP sockets in use",
            "gridPos": {"h": 4, "w": 8, "x": 16, "y": 28},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "area"},
            "targets": [{"refId": "A", "expr": "node_sockstat_TCP_inuse{instance=~\"$$instance\"}", "datasource": {"type": "prometheus", "uid": "prometheus"}}]
          }
        ]
      }


