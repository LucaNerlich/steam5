name: coolify
spring:
  datasource:
    hikari:
      # Surface connection leaks in prod logs (0 disables detection)
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:60000}
      # Kill runaway queries from broken jobs; normal gameplay queries finish in ms.
      connection-init-sql: SET statement_timeout = '${DB_STATEMENT_TIMEOUT:120s}'
  jpa:
    hibernate:
      # Flyway owns the schema in production; Hibernate may only verify it.
      # Schema changes ship as versioned migrations (db/migration), never as
      # automatic DDL on startup.
      ddl-auto: validate
# Presence WebSocket caps tuned for small Coolify/VPS heaps. Override via PRESENCE_* env vars.
# Open tabs ping to stay alive; background tabs stop pinging so idle sweep can reclaim them.
presence:
  max-global-connections: ${PRESENCE_MAX_GLOBAL_CONNECTIONS:500}
  max-scope-connections: ${PRESENCE_MAX_SCOPE_CONNECTIONS:200}
  max-ip-connections: ${PRESENCE_MAX_IP_CONNECTIONS:10}
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,prometheus} # https://www.baeldung.com/spring-boot-actuators
  endpoint:
    health:
      show-details: never
