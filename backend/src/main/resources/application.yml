name: default
spring:
  application:
    name: steam5
  profiles:
    active: ${SPRING_PROFILE:dev} # Default to 'dev', allow override via env (e.g., coolify in Docker)
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/steam5_db}
    username: steam5_user
    password: steam5_password
    driver-class-name: org.postgresql.Driver
    name: steam5_db
    hikari:
      # Keep defaults configurable per environment (especially production)
      maximum-pool-size: ${DB_POOL_MAX_SIZE:${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}}
      minimum-idle: ${DB_POOL_MIN_IDLE:${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:0}}
  jackson:
    serialization:
      indent-output: true
      order-map-entries-by-keys: true
  sql:
    init:
      mode: always
      platform: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  quartz:
    properties:
      org.quartz.scheduler.idleWaitTime: 1000 # 1000 is minimum
      org.quartz.threadPool.threadCount: 5
      jdbc.batch_size: 50
      order_inserts: true
      order_updates: true
      order_deletes: true
  web:
    error:
      include-message: always
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json, text/html, text/plain
    min-response-size: 1KB
management:
  endpoint:
    prometheus:
      access: read-only
  metrics:
    tags:
      application: steam5
    distribution:
      percentiles-histogram:
        http.server.requests: true
# Logging configuration is in logback-spring.xml
auth:
  jwtSecret: ${AUTH_JWT_SECRET:change-me-please-change-me-32-bytes-min}
  redirectBase: ${REDIRECT_BASE:http://localhost:3000}
admin:
  api-token: ${ADMIN_API_TOKEN:}
review:
  game:
    # days to avoid reusing an appid after it was picked; increase for fewer repeats
    do-not-repeat-days: 720
    # dynamic bucket boundaries for guessing game (inclusive upper bounds in ascending order)
    bucket-boundaries: [ 13, 111, 855, 6467 ]
    bucketTitles: [ 'unknown', 'niche', 'rising', 'popular', 'star' ]
    low-percentile: ${LOW_PERCENTILE:0.65}
    high-percentile: ${HIGH_PERCENTILE:0.95}
    # refresh reviews for picked apps when older than N days
    min-reviews-fresh-days: ${MIN_REVIEWS_FRESH_DAYS:7}

games:
  year:
    do-not-repeat-days: 365
    bucket-boundaries: [1999, 2009, 2019]
    rounds-per-day: 3
  price:
    do-not-repeat-days: 365
    bucket-boundaries: [499, 1499, 2999]
    rounds-per-day: 3
    currency: USD

presence:
  max-global-connections: ${PRESENCE_MAX_GLOBAL_CONNECTIONS:5000}
  max-scope-connections: ${PRESENCE_MAX_SCOPE_CONNECTIONS:500}
  max-ip-connections: ${PRESENCE_MAX_IP_CONNECTIONS:20}
  ticket-rate-limit-per-minute: ${PRESENCE_TICKET_RATE_LIMIT_PER_MINUTE:20}
  ticket-rate-limit-per-user-per-minute: ${PRESENCE_TICKET_RATE_LIMIT_PER_USER_PER_MINUTE:10}
  handshake-rate-limit-per-minute: ${PRESENCE_HANDSHAKE_RATE_LIMIT_PER_MINUTE:60}
  idle-timeout-seconds: ${PRESENCE_IDLE_TIMEOUT_SECONDS:90}
  sweep-interval-ms: ${PRESENCE_SWEEP_INTERVAL_MS:30000}

season:
  # default season length in days; persisted seasons keep their own dates if this changes mid-season
  length-days: ${SEASON_LENGTH_DAYS:30}
  awards:
    # how many placement levels to award per category (e.g., 1=winner only, 3=top three)
    max-placements: ${SEASON_AWARDS_MAX_PLACEMENTS:3}
    # minimum number of rounds a player must have during a season to be eligible for awards
    min-rounds: ${SEASON_AWARDS_MIN_ROUNDS:15}
    # categories evaluated per season; names must match SeasonAwardCategory enum
    categories:
      - MOST_POINTS
      - MOST_HITS
      - HIGHEST_AVG_POINTS_PER_DAY
      - LONGEST_STREAK

# per-job enable/disable toggles
jobs:
  steam-app-list:
    enabled: ${JOB_INGEST_LIST:false}
  steam-app-reviews:
    enabled: ${JOB_INGEST_REVIEWS:false}
  steam-app-details:
    enabled: ${JOB_INGEST_DETAILS:false}
  review-game-state:
    enabled: ${JOB_GENERATE_REVIEW_STATE:false}
  year-game-state:
    enabled: ${JOB_GENERATE_YEAR_STATE:false}
  price-game-state:
    enabled: ${JOB_GENERATE_PRICE_STATE:false}
  blurhash:
    enabled: ${JOB_BLURHASH:false}
  blurhashAvatar:
    enabled: ${JOB_BLURHASH_AVATAR:false}
  reviews-refresh:
    enabled: ${JOB_REVIEWS_REFRESH:false}
    nightly-limit: ${JOB_REVIEWS_REFRESH_LIMIT:15000}
  seasons-finalizer:
    enabled: ${JOB_SEASONS_FINALIZER:true}
  seasons-backfill:
    enabled: ${JOB_SEASONS_BACKFILL:false}
  player-spotlight:
    enabled: ${JOB_PLAYER_SPOTLIGHT:false}

